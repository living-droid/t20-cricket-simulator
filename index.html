function playMatchBase(teamA, teamB, pitch, rotA, rotB, playerLookup) {

    if (xiA.length !== 11 || xiB.length !== 11)
        throw new Error("Both teams must have exactly 11 players.");

    if (!checkA.ok)
        throw new Error(`${teamA.name}: ${checkA.reason}`);
    if (!checkB.ok)
        throw new Error(`${teamB.name}: ${checkB.reason}`);
    const rng = Math.random;
    const inn1 = simulateInnings(xiA, rotB, playerLookup, pitch, rng, undefined, bowlersB);
    const inn2 = simulateInnings(xiB, rotA, playerLookup, pitch, rng, inn1.totalRuns, bowlersA);
    let winnerId = null, margin = "";
    if (inn2.totalRuns > inn1.totalRuns) {
        winnerId = teamB.id;
        margin = `won by ${10 - inn2.totalWkts} wicket(s)`;
    }
    else if (inn1.totalRuns > inn2.totalRuns) {
        winnerId = teamA.id;
        margin = `won by ${inn1.totalRuns - inn2.totalRuns} run(s)`;
    }
    else
        margin = "Match tied";
    return { inn1, inn2, winnerId, margin, rotationAudit: "AUDIT PASSED: Batting positions and rotation locks adhered to with 0% deviation.", playerOfMatch: calculatePlayerOfMatch(inn1, inn2), verification: { teamA: getPreMatchVerification(xiA, pitch), teamB: getPreMatchVerification(xiB, pitch) } };

function computeRecords(matches) {
    const effectiveMatches = [];
    const fixtureMap = new Map();
    matches.forEach((m) => { if (!m.fixtureId)
        effectiveMatches.push(m);
    else {
        const prev = fixtureMap.get(m.fixtureId);
        if (!prev || new Date(m.date).getTime() > new Date(prev.date).getTime())
            fixtureMap.set(m.fixtureId, m);
    } });
    effectiveMatches.push(...fixtureMap.values());
    const bat = new Map();
    const bowl = new Map();
    effectiveMatches.forEach((m) => {
        [m.inn1, m.inn2].forEach((inn) => {
            inn.battingCard.forEach((b) => {
                if (b.balls === 0)
                    return;
                const e = bat.get(b.id) || { id: b.id, name: b.name, runs: 0, balls: 0, fours: 0, sixes: 0, innings: 0 };
                e.runs += b.runs;
                e.balls += b.balls;
                e.fours += b.fours;
                e.sixes += b.sixes;
                e.innings += 1;
                bat.set(b.id, e);
            });
            inn.bowlingCard.forEach((b) => {
                const e = bowl.get(b.id) || { id: b.id, name: b.name, wkts: 0, balls: 0, runs: 0 };
                e.wkts += b.wkts;
                e.balls += b.balls;
                e.runs += b.runs;
                bowl.set(b.id, e);
            });
        });
    });
    const batArr = Array.from(bat.values());
    const bowlArr = Array.from(bowl.values());
    const qualifiedForSR = batArr.filter((b) => b.balls >= 12);
    return {
        topScorers: [...batArr].sort((a, b) => b.runs - a.runs).slice(0, 5),
        bestStrikeRate: [...qualifiedForSR].sort((a, b) => (b.runs / b.balls) - (a.runs / a.balls)).slice(0, 5),
        mostSixes: [...batArr].filter((b) => b.sixes > 0).sort((a, b) => b.sixes - a.sixes).slice(0, 5),
        mostFours: [...batArr].filter((b) => b.fours > 0).sort((a, b) => b.fours - a.fours).slice(0, 5),
        topWicketTakers: [...bowlArr].filter((b) => b.wkts > 0).sort((a, b) => b.wkts - a.wkts || a.runs - b.runs).slice(0, 5),
    };
}

function normalizeStoredRotations(data) {
    const players = data.players || [];
    const byId = new Map(players.map(p => [p.id, p]));
    const byName = new Map(players.map(p => [String(p.name || "").trim().toLowerCase(), p.id]));
    const teams = (data.teams || []).map(team => {
        const source = team.bowlingRotation || team.rotation || {};
        const normalized = {};
        Object.entries(source).forEach(([over, value]) => {
            if (!value) return;
            if (byId.has(value)) normalized[over] = value;
            else {
                const id = byName.get(String(value).trim().toLowerCase());
                if (id) normalized[over] = id;
            }
        });
        return { ...team, bowlingRotation: normalized };
    });
    return { ...data, teams };

async function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw)
            return normalizeStoredRotations({ ...EMPTY_DATA, ...JSON.parse(raw) });
        return EMPTY_DATA;
    }
    catch (e) {
        return EMPTY_DATA;
    }
}
async function saveData(data) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
    }
    catch (e) {

function parsePlayingXIText(text) {

function autoRotation(bowlers) {
